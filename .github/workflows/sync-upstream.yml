name: Sync upstream (StealthHumanizer)

# Keeps `master` mirrored on rudra496/StealthHumanizer, then rebases the
# patch branch on top and verifies it still builds before pushing.
# If the rebase conflicts, or the rebase succeeds but the build breaks,
# no branch is force-pushed — instead an Issue is opened so a human
# resolves it. This is intentional: silently pushing a broken or
# semantically-wrong merge is worse than doing nothing.

on:
  schedule:
    - cron: '0 3 * * 1' # every Monday 03:00 UTC — change as you like
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write
  issues: write

env:
  UPSTREAM_URL: https://github.com/rudra496/StealthHumanizer.git
  PATCH_BRANCH: my-patches   # <-- change if your branch is named differently
  BASE_BRANCH: master        # <-- change if upstream's default branch differs

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "upstream-sync-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream "$UPSTREAM_URL" || git remote set-url upstream "$UPSTREAM_URL"

      - name: Fetch upstream + origin
        run: |
          git fetch upstream
          git fetch origin

      - name: Fast-forward base branch from upstream
        run: |
          git checkout "$BASE_BRANCH"
          git merge --ff-only "upstream/$BASE_BRANCH"
          git push origin "$BASE_BRANCH"

      - name: Check whether patch branch is already up to date
        id: diffcheck
        run: |
          git checkout "$PATCH_BRANCH"
          if git merge-base --is-ancestor "$BASE_BRANCH" "$PATCH_BRANCH"; then
            echo "already_current=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebase patch branch onto updated base
        id: rebase
        if: steps.diffcheck.outputs.already_current == 'false'
        run: |
          if git rebase "$BASE_BRANCH"; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
          else
            git rebase --abort
            echo "status=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.rebase.outputs.status == 'clean'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        if: steps.rebase.outputs.status == 'clean'
        run: npm install --no-audit --no-fund

      - name: Type-check
        id: typecheck
        if: steps.rebase.outputs.status == 'clean'
        run: npx tsc --noEmit -p tsconfig.json
        continue-on-error: true

      - name: Build
        id: build
        if: steps.rebase.outputs.status == 'clean'
        run: npm run build
        continue-on-error: true

      - name: Push rebased branch (only if rebase + build both clean)
        if: steps.rebase.outputs.status == 'clean' && steps.typecheck.outcome == 'success' && steps.build.outcome == 'success'
        run: git push --force-with-lease origin "$PATCH_BRANCH"

      - name: Open issue — rebase conflict
        if: steps.rebase.outputs.status == 'conflict'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'Automatic rebase of `${{ env.PATCH_BRANCH }}` onto the updated `${{ env.BASE_BRANCH }}` failed with a conflict.',
              '',
              'Upstream likely changed a file your patch also touches (most often `lib/providers.ts`). Resolve manually:',
              '',
              '```bash',
              'git fetch upstream',
              'git checkout ${{ env.BASE_BRANCH }} && git merge --ff-only upstream/${{ env.BASE_BRANCH }} && git push origin ${{ env.BASE_BRANCH }}',
              'git checkout ${{ env.PATCH_BRANCH }}',
              'git rebase ${{ env.BASE_BRANCH }}',
              '# fix conflicts in each commit, then:',
              '#   git add <file> && git rebase --continue',
              'npm install && npx tsc --noEmit -p tsconfig.json && npm run build',
              'git push --force-with-lease origin ${{ env.PATCH_BRANCH }}',
              '```',
              '',
              'See CHANGES.md in the repo root for what each of your patch commits does, to help decide how to resolve.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Upstream sync: rebase conflict on ${{ env.PATCH_BRANCH }}',
              body,
              labels: ['upstream-sync'],
            });

      - name: Open issue — build broke after clean rebase
        if: steps.rebase.outputs.status == 'clean' && (steps.typecheck.outcome == 'failure' || steps.build.outcome == 'failure')
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '`${{ env.PATCH_BRANCH }}` rebased onto the updated `${{ env.BASE_BRANCH }}` with **no textual conflicts**, but the project no longer type-checks or builds.',
              '',
              'This usually means upstream renamed/changed an export, function signature, or removed something your patch relies on.',
              '',
              'The rebase was NOT pushed. To reproduce locally:',
              '',
              '```bash',
              'git fetch upstream',
              'git checkout ${{ env.BASE_BRANCH }} && git merge --ff-only upstream/${{ env.BASE_BRANCH }} && git push origin ${{ env.BASE_BRANCH }}',
              'git checkout ${{ env.PATCH_BRANCH }}',
              'git rebase ${{ env.BASE_BRANCH }}',
              'npm install',
              'npx tsc --noEmit -p tsconfig.json',
              'npm run build',
              '# fix the errors shown above, then:',
              'git push --force-with-lease origin ${{ env.PATCH_BRANCH }}',
              '```',
              '',
              'See CHANGES.md in the repo root for what each of your patch commits does.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Upstream sync: build broke after clean rebase on ${{ env.PATCH_BRANCH }}',
              body,
              labels: ['upstream-sync'],
            });
